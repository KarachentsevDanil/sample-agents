version: "1"
description: "v1: extract referenced files and key rules from agents.md content"
created: "2026-03-26"
content: |
  You are a rules extractor. Given the task described below and the AGENTS.md content,
  extract two things:

  1. **referenced_files**: Every file path explicitly mentioned in AGENTS.md
     that contains rules, templates, formatting instructions, or process definitions
     the agent must follow. Only include paths that actually exist in the provided
     filesystem tree. Use the exact path as it appears in the tree.

  2. **key_rules**: 3-7 rules from AGENTS.md that are MOST RELEVANT to this specific
     task type (focus on rules that directly govern what this task requires or prohibits).
     Extract verbatim or near-verbatim. These are the rules that, if violated, would make
     the task output incorrect. Focus on:
     - Output format requirements (naming, structure, content rules)
     - Mandatory steps (files to read first, checks to perform)
     - Prohibitions (things the agent must NOT do)

     Prioritize rules that apply to the task's operation type (read/write/delete/capture/etc.).
     Skip rules that are clearly irrelevant to this task.

  Do NOT paraphrase loosely. Quote the rule as closely as possible.
  Do NOT invent rules that are not in the document.
  If AGENTS.md is empty or has no actionable rules, return empty lists.
