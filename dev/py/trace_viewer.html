<!DOCTYPE html>
<html class="dark">
<head>
  <meta charset="UTF-8">
  <title>Trace Viewer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    /* scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #171717; }
    ::-webkit-scrollbar-thumb { background: #404040; border-radius: 3px; }

    .node-circle { cursor: pointer; stroke-width: 2; }
    .node-circle:hover { stroke: #fff; }
    .node-circle.selected { stroke: #f59e0b; stroke-width: 3; }
    .link { fill: none; stroke: #525252; stroke-width: 1.5; }
    .node-label { font-size: 11px; fill: #a3a3a3; pointer-events: none; }

    pre { white-space: pre-wrap; word-break: break-word; }

    .tab { padding: 6px 14px; cursor: pointer; border-bottom: 2px solid transparent; color: #a3a3a3; font-size: 13px; }
    .tab:hover { color: #e5e5e5; }
    .tab.active { color: #f59e0b; border-bottom-color: #f59e0b; }

    .badge { display: inline-block; padding: 1px 8px; border-radius: 9999px; font-size: 11px; font-weight: 600; }
    .badge-green { background: #166534; color: #86efac; }
    .badge-amber { background: #78350f; color: #fcd34d; }
    .badge-red { background: #7f1d1d; color: #fca5a5; }
    .badge-blue { background: #1e3a5f; color: #93c5fd; }
    .badge-purple { background: #3b0764; color: #d8b4fe; }

    .step-row { padding: 8px 12px; cursor: pointer; border-left: 3px solid transparent; }
    .step-row:hover { background: #262626; }
    .step-row.selected { background: #1c1c1c; border-left-color: #f59e0b; }
  </style>
</head>
<body class="bg-neutral-950 text-neutral-100 h-screen flex flex-col overflow-hidden">

  <!-- Header -->
  <div id="header" class="flex items-center gap-4 px-4 py-2 border-b border-neutral-800 bg-neutral-900 shrink-0">
    <div class="font-semibold text-sm">Trace Viewer</div>
    <div id="meta-info" class="flex gap-3 text-xs text-neutral-400"></div>
    <div class="ml-auto flex items-center gap-2">
      <span id="outcome-badge" class="badge"></span>
    </div>
  </div>

  <!-- Main layout -->
  <div class="flex flex-1 overflow-hidden">

    <!-- Left sidebar: step list -->
    <div id="sidebar" class="w-72 border-r border-neutral-800 flex flex-col shrink-0">
      <div class="px-3 py-2 text-xs text-neutral-500 font-semibold uppercase tracking-wider border-b border-neutral-800">
        Steps (<span id="step-count">0</span>)
      </div>
      <div id="step-list" class="flex-1 overflow-y-auto"></div>
      <!-- Task summary -->
      <div id="task-summary" class="border-t border-neutral-800 p-3 text-xs text-neutral-400 max-h-40 overflow-y-auto"></div>
    </div>

    <!-- Center: D3 tree -->
    <div id="tree-container" class="flex-1 relative overflow-hidden">
      <svg id="treeSvg" class="w-full h-full"></svg>
      <div class="absolute bottom-2 right-2 flex gap-1">
        <button id="zoom-in" class="bg-neutral-800 hover:bg-neutral-700 text-neutral-300 px-2 py-1 rounded text-xs">+</button>
        <button id="zoom-out" class="bg-neutral-800 hover:bg-neutral-700 text-neutral-300 px-2 py-1 rounded text-xs">-</button>
        <button id="zoom-reset" class="bg-neutral-800 hover:bg-neutral-700 text-neutral-300 px-2 py-1 rounded text-xs">Reset</button>
      </div>
    </div>

    <!-- Right panel: detail -->
    <div id="detail" class="w-[420px] border-l border-neutral-800 flex flex-col shrink-0 hidden">
      <div id="detail-header" class="px-4 py-2 border-b border-neutral-800 bg-neutral-900">
        <div class="flex items-center justify-between">
          <span id="detail-title" class="text-sm font-semibold"></span>
          <button id="detail-close" class="text-neutral-500 hover:text-neutral-300 text-lg leading-none">&times;</button>
        </div>
      </div>
      <div id="detail-tabs" class="flex border-b border-neutral-800 bg-neutral-900 px-2"></div>
      <div id="detail-content" class="flex-1 overflow-y-auto p-4 text-xs font-mono"></div>
    </div>
  </div>

  <script>
    // TRACE data is injected here by the Python template
    // When used as a template, {trace_json} is replaced; for dev, load from variable
    const TRACE = typeof TRACE_DATA !== 'undefined' ? TRACE_DATA : /*TRACE_JSON_PLACEHOLDER*/ null;

    if (!TRACE) {
      document.body.innerHTML = '<div class="flex items-center justify-center h-screen text-neutral-500 text-lg">No trace data loaded</div>';
      throw new Error('No trace data');
    }

    // ─── Color map for context types ───
    const CONTEXT_COLORS = {
      'ReActAgent': '#3b82f6',
      'Verifier': '#a855f7',
      'TaskAnalyzer': '#22c55e',
      'Orchestrator': '#ef4444',
      'ProductExplorer': '#f59e0b',
    };
    function nodeColor(ctx) {
      return CONTEXT_COLORS[ctx] || '#6b7280';
    }

    // ─── Render header ───
    const meta = TRACE.meta || {};
    const task = TRACE.task || {};
    const trace = TRACE.trace || [];

    document.getElementById('meta-info').innerHTML = [
      meta.model && `<span>Model: <span class="text-neutral-200">${meta.model}</span></span>`,
      meta.task_id && `<span>Task: <span class="text-neutral-200">${meta.task_id}</span></span>`,
      task.step_count != null && `<span>Steps: <span class="text-neutral-200">${task.step_count}</span></span>`,
      meta.started_at && `<span>${meta.started_at}</span>`,
    ].filter(Boolean).join('');

    const outcomeBadge = document.getElementById('outcome-badge');
    if (task.outcome) {
      const isOk = task.outcome === 'OUTCOME_OK';
      outcomeBadge.textContent = task.outcome.replace('OUTCOME_', '');
      outcomeBadge.className = `badge ${isOk ? 'badge-green' : 'badge-red'}`;
    }

    // ─── Task summary ───
    const taskSummary = document.getElementById('task-summary');
    taskSummary.innerHTML = `
      <div class="mb-1 font-semibold text-neutral-300">Task</div>
      <div class="mb-2">${task.text || 'N/A'}</div>
      ${task.final_answer ? `<div class="mb-1 font-semibold text-neutral-300">Answer</div><div class="mb-2">${escapeHtml(task.final_answer)}</div>` : ''}
      ${task.files_used?.length ? `<div class="font-semibold text-neutral-300">Files</div><div>${task.files_used.map(f => `<div class="text-neutral-500">${f}</div>`).join('')}</div>` : ''}
    `;

    // ─── Step list (sidebar) ───
    const stepList = document.getElementById('step-list');
    document.getElementById('step-count').textContent = trace.length;

    trace.forEach((ev, i) => {
      const div = document.createElement('div');
      div.className = 'step-row';
      div.dataset.index = i;

      const isValidator = ev.type === 'validator_step';
      const toolName = isValidator ? 'verify_answer' : (ev.output?.tool_name || ev.tool_calls?.[0]?.name || '—');
      const badgeClass = isValidator ? 'badge-purple' : 'badge-blue';

      div.innerHTML = `
        <div class="flex items-center gap-2 mb-1">
          <span class="badge ${badgeClass}">${ev.node_id || i + 1}</span>
          <span class="text-neutral-200 text-sm font-medium">${toolName}</span>
        </div>
        ${ev.thinking ? `<div class="text-neutral-500 text-xs truncate">${escapeHtml(ev.thinking.substring(0, 80))}...</div>` : ''}
      `;
      div.addEventListener('click', () => selectNode(i));
      stepList.appendChild(div);
    });

    // ─── D3 Tree visualization ───
    const svg = d3.select('#treeSvg');
    const container = document.getElementById('tree-container');
    const width = container.clientWidth;
    const height = container.clientHeight;

    svg.attr('viewBox', `0 0 ${width} ${height}`);

    const g = svg.append('g');

    // Build hierarchy: for now flat (all depth 0), arrange as horizontal chain
    const nodeRadius = 18;
    const nodeSpacingX = 100;
    const nodeSpacingY = 60;
    const startX = 60;
    const startY = height / 2;

    // Layout nodes in a horizontal line (flat hierarchy)
    const nodes = trace.map((ev, i) => ({
      ...ev,
      index: i,
      x: startX + i * nodeSpacingX,
      y: startY,
    }));

    // Draw links
    g.selectAll('.link')
      .data(nodes.slice(1))
      .enter()
      .append('path')
      .attr('class', 'link')
      .attr('d', (d, i) => {
        const prev = nodes[i];
        return `M${prev.x},${prev.y} C${prev.x + nodeSpacingX / 2},${prev.y} ${d.x - nodeSpacingX / 2},${d.y} ${d.x},${d.y}`;
      });

    // Draw node groups
    const nodeGroups = g.selectAll('.node')
      .data(nodes)
      .enter()
      .append('g')
      .attr('transform', d => `translate(${d.x},${d.y})`);

    nodeGroups.append('circle')
      .attr('class', 'node-circle')
      .attr('r', nodeRadius)
      .attr('fill', d => nodeColor(d.context))
      .attr('stroke', d => d3.color(nodeColor(d.context)).darker(0.5))
      .on('click', (event, d) => selectNode(d.index));

    nodeGroups.append('text')
      .attr('class', 'node-label')
      .attr('text-anchor', 'middle')
      .attr('dy', nodeRadius + 16)
      .text(d => {
        const name = d.type === 'validator_step' ? 'verify' : (d.output?.tool_name || d.tool_calls?.[0]?.name || '?');
        return name.length > 12 ? name.substring(0, 10) + '..' : name;
      });

    // Node ID inside circle
    nodeGroups.append('text')
      .attr('text-anchor', 'middle')
      .attr('dy', 4)
      .attr('fill', '#fff')
      .attr('font-size', '10px')
      .attr('font-weight', '600')
      .attr('pointer-events', 'none')
      .text(d => d.node_id || d.index + 1);

    // Zoom / pan
    const zoom = d3.zoom()
      .scaleExtent([0.2, 4])
      .on('zoom', (event) => g.attr('transform', event.transform));

    svg.call(zoom);

    // Fit initial view
    const totalWidth = nodes.length * nodeSpacingX + startX * 2;
    if (totalWidth > width) {
      const scale = Math.min(1, width / totalWidth);
      const tx = 20;
      const ty = (height - height * scale) / 2;
      svg.call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
    }

    document.getElementById('zoom-in').addEventListener('click', () => svg.transition().call(zoom.scaleBy, 1.3));
    document.getElementById('zoom-out').addEventListener('click', () => svg.transition().call(zoom.scaleBy, 0.7));
    document.getElementById('zoom-reset').addEventListener('click', () => svg.transition().call(zoom.transform, d3.zoomIdentity));

    // ─── Detail panel ───
    let selectedIndex = -1;

    function selectNode(i) {
      const ev = trace[i];
      if (!ev) return;

      selectedIndex = i;

      // Update sidebar selection
      stepList.querySelectorAll('.step-row').forEach((el, idx) => {
        el.classList.toggle('selected', idx === i);
      });

      // Update tree selection
      nodeGroups.selectAll('.node-circle').classed('selected', (d) => d.index === i);

      // Show detail panel
      const detail = document.getElementById('detail');
      detail.classList.remove('hidden');

      const toolName = ev.type === 'validator_step' ? 'verify_answer' : (ev.output?.tool_name || '—');
      document.getElementById('detail-title').textContent = `Node ${ev.node_id || i + 1}: ${toolName}`;

      // Build tabs
      const tabs = [];
      if (ev.thinking) tabs.push({ id: 'thinking', label: 'Thinking' });
      if (ev.tool_calls?.length) tabs.push({ id: 'tool_calls', label: 'Tool Calls' });
      if (ev.messages?.length) tabs.push({ id: 'messages', label: 'Messages' });
      if (ev.system_prompt) tabs.push({ id: 'system', label: 'System' });
      if (ev.type === 'validator_step') tabs.push({ id: 'validator', label: 'Validation' });
      if (tabs.length === 0) tabs.push({ id: 'raw', label: 'Raw' });

      const tabsEl = document.getElementById('detail-tabs');
      tabsEl.innerHTML = '';
      tabs.forEach((t, idx) => {
        const el = document.createElement('div');
        el.className = `tab ${idx === 0 ? 'active' : ''}`;
        el.textContent = t.label;
        el.addEventListener('click', () => {
          tabsEl.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
          el.classList.add('active');
          renderTab(ev, t.id);
        });
        tabsEl.appendChild(el);
      });

      renderTab(ev, tabs[0].id);
    }

    function renderTab(ev, tabId) {
      const content = document.getElementById('detail-content');

      switch (tabId) {
        case 'thinking':
          content.innerHTML = `<pre class="text-emerald-300/80 leading-relaxed">${escapeHtml(ev.thinking)}</pre>`;
          break;

        case 'tool_calls':
          content.innerHTML = ev.tool_calls.map(tc => `
            <div class="mb-4">
              <div class="text-amber-400 font-semibold mb-1">${tc.name}</div>
              <div class="text-neutral-500 mb-1">Request:</div>
              <pre class="bg-neutral-900 p-2 rounded mb-2 text-blue-300">${escapeHtml(formatJson(tc.request))}</pre>
              <div class="text-neutral-500 mb-1">Response:</div>
              <pre class="bg-neutral-900 p-2 rounded text-green-300 max-h-96 overflow-y-auto">${escapeHtml(formatResponse(tc.response))}</pre>
            </div>
          `).join('<hr class="border-neutral-800 my-3">');
          break;

        case 'messages':
          content.innerHTML = ev.messages.map(m => `
            <div class="mb-3">
              <span class="badge ${m.role === 'user' ? 'badge-blue' : m.role === 'assistant' ? 'badge-green' : 'badge-amber'}">${m.role}</span>
              <pre class="mt-1 text-neutral-300 leading-relaxed max-h-64 overflow-y-auto">${escapeHtml(formatContent(m.content))}</pre>
            </div>
          `).join('');
          break;

        case 'system':
          content.innerHTML = `<pre class="text-neutral-300 leading-relaxed">${escapeHtml(ev.system_prompt)}</pre>`;
          break;

        case 'validator':
          let validationData = ev.result || '';
          try { validationData = formatJson(JSON.parse(validationData)); } catch {}
          content.innerHTML = `<pre class="text-purple-300 leading-relaxed">${escapeHtml(validationData)}</pre>`;
          break;

        default:
          content.innerHTML = `<pre class="text-neutral-400">${escapeHtml(JSON.stringify(ev, null, 2))}</pre>`;
      }
    }

    document.getElementById('detail-close').addEventListener('click', () => {
      document.getElementById('detail').classList.add('hidden');
      selectedIndex = -1;
      stepList.querySelectorAll('.step-row').forEach(el => el.classList.remove('selected'));
      nodeGroups.selectAll('.node-circle').classed('selected', false);
    });

    // ─── Helpers ───
    function escapeHtml(str) {
      if (typeof str !== 'string') str = String(str ?? '');
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function formatJson(obj) {
      if (typeof obj === 'string') {
        try { obj = JSON.parse(obj); } catch { return obj; }
      }
      return JSON.stringify(obj, null, 2);
    }

    function formatResponse(resp) {
      if (typeof resp === 'string') {
        // Try to parse as JSON for pretty-printing
        try {
          const parsed = JSON.parse(resp);
          return JSON.stringify(parsed, null, 2);
        } catch {
          return resp;
        }
      }
      return JSON.stringify(resp, null, 2);
    }

    function formatContent(content) {
      if (typeof content === 'string') return content;
      if (Array.isArray(content)) {
        return content.map(c => {
          if (typeof c === 'string') return c;
          if (c.type === 'text') return c.text || '';
          if (c.type === 'tool_use') return `[tool_use: ${c.name}] ${JSON.stringify(c.input, null, 2)}`;
          if (c.type === 'tool_result') return `[tool_result: ${c.tool_use_id}] ${typeof c.content === 'string' ? c.content : JSON.stringify(c.content)}`;
          return JSON.stringify(c, null, 2);
        }).join('\n\n');
      }
      return JSON.stringify(content, null, 2);
    }

    // Auto-select first node
    if (trace.length > 0) selectNode(0);
  </script>
</body>
</html>
